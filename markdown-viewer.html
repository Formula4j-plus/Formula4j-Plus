<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档查看 - Formula4j-Plus</title>
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme') || 'system';
                var resolvedTheme = savedTheme === 'system'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : savedTheme;
                document.documentElement.setAttribute('data-theme', resolvedTheme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="mask-icon" href="favicon.svg" color="#2563eb">
    <!-- 尝试多个 CDN 加载 marked.js -->
    <script>
        // 多个 CDN 备用方案
        const markedCDNs = [
            'https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js',
            'https://unpkg.com/marked@11.1.1/marked.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js',
            'https://fastly.jsdelivr.net/npm/marked@11.1.1/marked.min.js'
        ];

        // 简单的 markdown 解析器（作为备用）
        window.createSimpleMarkdownParser = function() {
            return {
                parse: function(markdown) {
                    let html = markdown;
                    
                    // 先处理代码块（避免被其他规则影响）
                    const codeBlocks = [];
                    html = html.replace(/```([\w]*)\n?([\s\S]*?)```/g, function(match, lang, code) {
                        const id = 'CODE_BLOCK_' + codeBlocks.length;
                        codeBlocks.push('<pre><code class="language-' + (lang || '') + '">' + 
                                      code.trim().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + 
                                      '</code></pre>');
                        return id;
                    });
                    
                    // 处理行内代码（避免被其他规则影响）
                    const inlineCodes = [];
                    html = html.replace(/`([^`\n]+)`/g, function(match, code) {
                        const id = 'INLINE_CODE_' + inlineCodes.length;
                        inlineCodes.push('<code>' + code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>');
                        return id;
                    });
                    
                    // 转义 HTML（但保留已标记的代码块和行内代码）
                    html = html.replace(/&/g, '&amp;')
                              .replace(/</g, '&lt;')
                              .replace(/>/g, '&gt;');
                    
                    // 恢复代码块
                    codeBlocks.forEach(function(code, index) {
                        html = html.replace('CODE_BLOCK_' + index, code);
                    });
                    
                    // 恢复行内代码
                    inlineCodes.forEach(function(code, index) {
                        html = html.replace('INLINE_CODE_' + index, code);
                    });
                    
                    // 标题（按顺序，从多级到少级）
                    html = html.replace(/^###### (.*$)/gim, '<h6>$1</h6>');
                    html = html.replace(/^##### (.*$)/gim, '<h5>$1</h5>');
                    html = html.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
                    html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                    html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
                    html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
                    
                    // 粗体和斜体（先处理粗体，避免嵌套问题）
                    html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
                    html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
                    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                    html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
                    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
                    html = html.replace(/_(.+?)_/g, '<em>$1</em>');
                    
                    // 链接
                    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                    
                    // 图片
                    html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
                    
                    // 水平线
                    html = html.replace(/^---$/gim, '<hr>');
                    html = html.replace(/^\*\*\*$/gim, '<hr>');
                    
                    // 引用块
                    html = html.replace(/^> (.+)$/gim, '<blockquote>$1</blockquote>');
                    
                    // 有序列表
                    html = html.replace(/^(\d+)\. (.+)$/gim, '<li>$2</li>');
                    html = html.replace(/(<li>.*<\/li>)/s, function(match) {
                        return '<ol>' + match + '</ol>';
                    });
                    
                    // 无序列表
                    html = html.replace(/^[\*\-\+] (.+)$/gim, '<li>$1</li>');
                    html = html.replace(/(<li>.*<\/li>)/s, function(match) {
                        if (!match.includes('<ol>')) {
                            return '<ul>' + match + '</ul>';
                        }
                        return match;
                    });
                    
                    // 段落（处理空行）
                    html = html.split('\n\n').map(function(para) {
                        para = para.trim();
                        if (para && !para.match(/^<[h|u|o|b|p|d]/)) {
                            return '<p>' + para + '</p>';
                        }
                        return para;
                    }).join('\n');
                    
                    // 换行
                    html = html.replace(/\n/g, '<br>');
                    
                    return html;
                },
                setOptions: function() {} // 兼容性方法
            };
        };

        // 加载 marked.js
        let markedLoaded = false;
        let loadAttempt = 0;

        function loadMarked() {
            if (loadAttempt >= markedCDNs.length) {
                // 所有 CDN 都失败，使用备用解析器
                console.warn('所有 CDN 加载失败，使用备用 markdown 解析器');
                window.marked = createSimpleMarkdownParser();
                markedLoaded = true;
                if (window.onMarkedReady) {
                    window.onMarkedReady();
                }
                return;
            }

            const script = document.createElement('script');
            script.src = markedCDNs[loadAttempt];
            script.onload = function() {
                markedLoaded = true;
                if (window.onMarkedReady) {
                    window.onMarkedReady();
                }
            };
            script.onerror = function() {
                loadAttempt++;
                loadMarked();
            };
            document.head.appendChild(script);
        }

        // 开始加载
        loadMarked();

        const codeHighlightRules = [
            {
                regex: /(\/\/.*$)/gm,
                className: 'ch-comment'
            },
            {
                regex: /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,
                className: 'ch-string'
            },
            {
                regex: /\b(import|package|public|private|protected|class|interface|enum|static|final|void|new|return|if|else|for|while|switch|case|break|continue|try|catch|finally|throw|throws|extends|implements|boolean|int|long|double|float|char|byte|short|null|true|false)\b/g,
                className: 'ch-keyword'
            },
            {
                regex: /\b(\d+(?:\.\d+)?)\b/g,
                className: 'ch-number'
            },
            {
                regex: /\b([A-Za-z_][\w]*)\s*(?=\()/g,
                className: 'ch-function'
            }
        ];

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function highlightCodeText(text) {
            const placeholders = [];
            let html = escapeHtml(text);

            codeHighlightRules.forEach((rule) => {
                html = html.replace(rule.regex, (match) => {
                    const key = `__TOKEN_${placeholders.length}__`;
                    placeholders.push(`<span class="${rule.className}">${match}</span>`);
                    return key;
                });
            });

            placeholders.forEach((value, index) => {
                html = html.replace(new RegExp(`__TOKEN_${index}__`, 'g'), value);
            });

            return html;
        }

        function enhanceCodeBlocks(root = document) {
            root.querySelectorAll('pre code').forEach((codeEl) => {
                if (codeEl.dataset.highlighted === 'true') {
                    return;
                }

                if (codeEl.querySelector('span')) {
                    codeEl.dataset.highlighted = 'true';
                    return;
                }

                const rawText = codeEl.textContent || '';
                codeEl.innerHTML = highlightCodeText(rawText);
                codeEl.dataset.highlighted = 'true';
            });
        }
    </script>
    <style>
        * {

            --bg: #FFFFFF;
            --bg-elevated: #F8FAFC;
            --bg-card: #FFFFFF;
            --surface-subtle: rgba(148, 163, 184, 0.12);
            --text: #1E293B;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --code-bg: #EFF6FF;
            --code-surface: #F8FAFC;
            --code-border: #BFDBFE;
            --code-text: #0F172A;
            --inline-code-bg: #DBEAFE;
            --inline-code-border: #BFDBFE;
            --inline-code-text: #1D4ED8;
            --blockquote-bg: #EFF6FF;
            --table-stripe: #F8FAFC;
        }

            line-height: 1.7;
            color: var(--text);
            background-color: var(--bg);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a {
            color: var(--primary-hover);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--cta);
        }

            position: fixed;
            top: var(--space-4);
            right: var(--space-4);
            display: flex;
            gap: var(--space-2);
            z-index: 1000;
            background: color-mix(in srgb, var(--bg-card) 86%, transparent);
            border: 1px solid color-mix(in srgb, var(--border) 82%, transparent);
            border-radius: 999px;
            padding: var(--space-1);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(16px);
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 0.625rem 0.95rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 999px;
            color: var(--text-secondary);
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .control-btn:hover {
            background: var(--bg-elevated);
            color: var(--text);
            transform: translateY(-1px);
        }

        .control-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
        }

        .control-btn svg {
            width: 16px;
            height: 16px;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + var(--space-2));
            right: 0;
            background: color-mix(in srgb, var(--bg-card) 94%, transparent);
            border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
            border-radius: 20px;

            z-index: 10;
            padding: var(--space-1);
            backdrop-filter: blur(18px);
        }

        .dropdown-menu.show {

            visibility: visible;
            transform: translateY(0) scale(1);
        }

            display: block;
            width: 100%;
            padding: var(--space-2) var(--space-4);
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .dropdown-item:hover {
            background: var(--bg-elevated);
            color: var(--text);
        }

        .dropdown-item.active {
            color: var(--primary-hover);
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: var(--space-1) 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-6);
        }

        .doc-shell {
            max-width: 900px;
            margin: 0 auto;
            padding: 6.5rem 0 var(--space-8);
        }

        .doc-header {
            margin-bottom: var(--space-8);
            padding-bottom: var(--space-6);
            border-bottom: 1px solid var(--border);
        }

            font-size: 1rem;
            line-height: 1.8;
            margin-top: calc(var(--space-4) * -1);
            margin-bottom: 0;

        h1 {

            font-weight: 700;
            margin-bottom: var(--space-8);
            background: linear-gradient(135deg, var(--text) 0%, var(--primary-hover) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: 0.85rem 1.35rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text);
            font-weight: 600;
            margin-bottom: var(--space-8);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .back-btn:hover {

            color: var(--text);
            background: var(--bg-card);
            transform: translateY(-1px);
        }

        .back-btn svg {

            height: 16px;

            justify-content: center;
            gap: var(--space-2);
            padding: 0.85rem 1.35rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text);
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {

            transform: translateY(-1px);
            color: var(--text);
        }

        .markdown-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 3rem;
            margin: 0;
            backdrop-filter: none;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        [data-theme="dark"] .markdown-container {
            background: rgba(15, 23, 42, 0.92);
            border-color: rgba(51, 65, 85, 0.9);
            box-shadow: 0 24px 64px rgba(2, 6, 23, 0.35);
        }

        [data-theme="light"] .markdown-container {
            background: rgba(255, 255, 255, 0.94);
            border-color: rgba(191, 219, 254, 0.9);
            box-shadow: 0 24px 64px rgba(148, 163, 184, 0.2);
        }

        .loading {

            padding: 3rem;
            color: var(--text-secondary);
        }

        .error {
            text-align: center;
            padding: 3rem;
            color: #ef4444;
        }

        /* Markdown Styles */
        .markdown-body {
            line-height: 1.8;
        }

        .markdown-body h1 {
            font-size: 2.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
            color: var(--text);
        }

        .markdown-body h2 {

            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text);
        }

        .markdown-body h3 {

            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        .markdown-body h4 {

            margin-top: 1.25rem;
            margin-bottom: 0.5rem;

        }

            color: var(--text);
        }

        .markdown-body ul, .markdown-body ol {

            padding-left: 2rem;
        }

        .markdown-body li {

        }

        .markdown-body blockquote {
            border-left: 4px solid var(--primary-color);
            margin: 1rem 0;

        }

            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--inline-code-text);
            border: 1px solid var(--inline-code-border);
        }

            color: var(--code-text);
            padding: 1.5rem;

            overflow-x: auto;
            overflow-y: hidden;
            margin: 1.5rem 0;
            border: 1px solid var(--code-border);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 12px 32px rgba(148, 163, 184, 0.16);
            white-space: pre;

            tab-size: 4;

        .markdown-body pre code {
            background: transparent;

            border: none;

            font-size: 0.9rem;
            line-height: 1.6;

            white-space: inherit;
            min-width: max-content;
        }

        .ch-keyword { color: #C792EA; }
        .ch-string { color: #C3E88D; }
        .ch-comment { color: var(--text-muted); font-style: italic; }
        .ch-function { color: #82AAFF; }
        .ch-number { color: #F78C6C; }

        [data-theme="light"] .ch-keyword { color: #7C3AED; }
        [data-theme="light"] .ch-string { color: #047857; }
        [data-theme="light"] .ch-comment { color: #64748B; }
        [data-theme="light"] .ch-function { color: #2563EB; }
        [data-theme="light"] .ch-number { color: #C2410C; }


        .markdown-body table {

            margin: 1.5rem 0;
            border: 1px solid var(--border);
            border-radius: 12px;

            box-shadow: none;
        }

        .markdown-body th,
        .markdown-body td {
            padding: 0.875rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }


        .markdown-body th,
        .markdown-body td {
            padding: 0.875rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .markdown-body th {
            background: var(--bg-light);
            color: var(--text);
            font-weight: 600;
        }

            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }

            border-bottom-color: var(--primary-color);
        }

        .markdown-body img {

<body>
    <div class="control-bar">
        <div class="dropdown">
            <button class="control-btn" id="langBtn" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <span data-i18n="lang">语言</span>
            </button>
            <div class="dropdown-menu" id="langMenu">
                <button class="dropdown-item active" data-lang="zh-CN">简体中文</button>
                <button class="dropdown-item" data-lang="zh-TW">繁體中文</button>
                <button class="dropdown-item" data-lang="en">English</button>
            </div>
        </div>
        <div class="dropdown">
            <button class="control-btn" id="themeBtn" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span data-i18n="theme">主题</span>
            </button>
            <div class="dropdown-menu" id="themeMenu">
                <button class="dropdown-item" data-theme="light" data-i18n="light">日间模式</button>
                <button class="dropdown-item" data-theme="dark" data-i18n="dark">夜间模式</button>
                <div class="divider"></div>
                <button class="dropdown-item" data-theme="system" data-i18n="system">跟随系统</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="doc-shell">
            <div class="doc-header">
                <a href="index.html" class="back-btn" data-i18n="back_home">返回首页</a>
                <h1 data-i18n="page_title">文档查看</h1>
                <p class="doc-lead" data-i18n="page_desc">统一阅读 README、更新日志和其他 Markdown 文档，保持与站点文档页一致的主题、排版与代码阅读体验。</p>
            </div>

            <div class="markdown-container">
                <div id="loading" class="loading">正在加载文档...</div>
                <div id="error" class="error" style="display: none;"></div>
                <div id="content" class="markdown-body" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            'zh-CN': {
                lang: '语言',
                theme: '主题',
                light: '日间模式',
                dark: '夜间模式',
                system: '跟随系统',
                page_title: '文档查看',
                page_desc: '统一阅读 README、更新日志和其他 Markdown 文档，保持与站点文档页一致的主题、排版与代码阅读体验。',
                back_home: '返回首页',
                loading: '正在加载文档...',
                error_prefix: '加载失败: '
            },
            'zh-TW': {
                lang: '語言',
                theme: '主題',
                light: '日間模式',
                dark: '夜間模式',
                system: '跟隨系統',
                page_title: '文件檢視',
                page_desc: '統一閱讀 README、更新日誌與其他 Markdown 文件，保持與站點文件頁一致的主題、排版與程式碼閱讀體驗。',
                back_home: '返回首頁',
                loading: '正在載入文件...',
                error_prefix: '載入失敗: '
            },
            'en': {
                lang: 'Language',
                theme: 'Theme',
                light: 'Light Mode',
                dark: 'Dark Mode',
                system: 'System',
                page_title: 'Document Viewer',
                page_desc: 'Read the README, changelog, and other Markdown files with the same theme, spacing, and code-reading experience as the rest of the site.',
                back_home: 'Back to Home',
                loading: 'Loading document...',
                error_prefix: 'Load failed: '
            }
        };

        let currentLang = localStorage.getItem('lang') || 'zh-CN';
        let currentTheme = localStorage.getItem('theme') || 'system';
        const systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');

        function resolveSystemTheme() {
            const hour = new Date().getHours();
            return (hour >= 18 || hour < 7) ? 'dark' : 'light';
        }

        function getResolvedTheme(theme) {
            return theme === 'system' ? resolveSystemTheme() : theme;
        }

        function applyTranslations(lang) {
            const t = translations[lang] || translations['zh-CN'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });
            document.documentElement.lang = lang;
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', getResolvedTheme(theme));
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            icon.innerHTML = theme === 'light'
                ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
                : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        }

        function updateLangUI() {
            document.querySelectorAll('#langMenu .dropdown-item').forEach(item => {
                item.classList.toggle('active', item.dataset.lang === currentLang);
            });
        }

        function updateThemeUI() {
            document.querySelectorAll('#themeMenu .dropdown-item').forEach(item => {
                item.classList.toggle('active', item.dataset.theme === currentTheme);
            });
        }

        document.querySelectorAll('.dropdown').forEach(dropdown => {
            const btn = dropdown.querySelector('.control-btn');
            const menu = dropdown.querySelector('.dropdown-menu');
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.dropdown-menu').forEach(m => {
                    if (m !== menu) {
                        m.classList.remove('show');
                    }
                });
                menu.classList.toggle('show');
                btn.setAttribute('aria-expanded', menu.classList.contains('show'));
            });
        });

        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        });

        document.querySelectorAll('#langMenu .dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                currentLang = item.dataset.lang;
                localStorage.setItem('lang', currentLang);
                applyTranslations(currentLang);
                updateLangUI();
                const loadingEl = document.getElementById('loading');
                if (loadingEl && loadingEl.style.display !== 'none') {
                    loadingEl.textContent = (translations[currentLang] || translations['zh-CN']).loading;
                }
            });
        });

        document.querySelectorAll('#themeMenu .dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                currentTheme = item.dataset.theme;
                localStorage.setItem('theme', currentTheme);
                applyTheme(currentTheme);
                updateThemeUI();
            });
        });

        function syncThemeWithSystem() {
            if (currentTheme === 'system') {
                applyTheme('system');
                updateThemeUI();
            }
        }

        function handleStoredThemeChange() {
            const storedTheme = localStorage.getItem('theme') || 'system';
            if (storedTheme !== currentTheme) {
                currentTheme = storedTheme;
            }
            applyTheme(currentTheme);
            updateThemeUI();
        }

        if (typeof systemThemeMedia.addEventListener === 'function') {
            systemThemeMedia.addEventListener('change', syncThemeWithSystem);
        } else if (typeof systemThemeMedia.addListener === 'function') {
            systemThemeMedia.addListener(syncThemeWithSystem);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                syncThemeWithSystem();
                handleStoredThemeChange();
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'theme') {
                handleStoredThemeChange();
            }
        });

        applyTranslations(currentLang);
        updateLangUI();
        applyTheme(currentTheme);
        updateThemeUI();

        // 获取URL参数中的文件路径
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 加载并渲染markdown文件
        async function loadMarkdown(file) {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const contentEl = document.getElementById('content');
            const t = translations[currentLang] || translations['zh-CN'];

            loadingEl.textContent = t.loading;

            // 等待 marked 加载完成
            function waitForMarked() {
                return new Promise((resolve) => {
                    if (typeof marked !== 'undefined') {
                        resolve();
                    } else {
                        window.onMarkedReady = resolve;
                        // 超时保护：5秒后使用备用解析器
                        setTimeout(() => {
                            if (typeof marked === 'undefined') {
                                window.marked = createSimpleMarkdownParser();
                                resolve();
                            }
                        }, 5000);
                    }
                });
            }

            try {
                // 等待 marked 加载
                await waitForMarked();
                
                // 从GitHub Pages加载文件
                const response = await fetch(file);
                
                if (!response.ok) {
                    throw new Error(`${response.status} ${response.statusText}`);
                }

                const markdown = await response.text();
                
                // 配置marked选项（如果支持）
                if (typeof marked !== 'undefined' && marked.setOptions) {
                    marked.setOptions({
                        breaks: true,
                        gfm: true,
                        headerIds: true,
                        mangle: false
                    });
                }

                // 渲染markdown
                let html;
                if (typeof marked !== 'undefined') {
                    html = marked.parse(markdown);
                } else {
                    // 如果 marked 仍未加载，使用备用解析器
                    const simpleParser = createSimpleMarkdownParser();
                    html = simpleParser.parse(markdown);
                }
                
                // 显示内容
                loadingEl.style.display = 'none';
                contentEl.innerHTML = html;
                enhanceCodeBlocks(contentEl);
                contentEl.style.display = 'block';

                // 更新页面标题
                const firstHeading = contentEl.querySelector('h1, h2');
                if (firstHeading) {
                    document.title = `${firstHeading.textContent} - Formula4j-Plus`;
                } else {
                    document.title = `${t.page_title} - Formula4j-Plus`;
                }
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = `${(translations[currentLang] || translations['zh-CN']).error_prefix}${error.message}`;
                console.error('Error loading markdown:', error);
            }
        }

        // 页面加载时执行
        window.addEventListener('DOMContentLoaded', () => {
            const file = getUrlParameter('file') || 'Project-Overview.md';
            
            // 如果直接访问，尝试从URL路径获取文件名
            if (file === 'Project-Overview.md' && window.location.pathname !== '/index.html') {
                const pathParts = window.location.pathname.split('/');
                const fileName = pathParts[pathParts.length - 1];
                if (fileName.endsWith('.md')) {
                    loadMarkdown(fileName);
                } else {
                    loadMarkdown(file);
                }
            } else {
                loadMarkdown(file);
            }
        });
    </script>
</body>
</html>
