# ProGuard配置文件
# 保留必要的类和方法签名，确保jar包可以正常使用
# 注意：输入输出jar配置在pom.xml中指定，这里不需要重复配置

# 保留主类
-keep public class com.formula.calculator.FormulaCalculator {
    public static *;
}

# 保留公共API
-keep public class com.formula.calculator.FormulaException {
    public *;
}

-keep public class com.formula.calculator.FormulaUtils {
    public static *;
}

# 保留模型类（需要序列化）
-keep class com.formula.calculator.model.** {
    *;
}

# 保留接口
-keep interface com.formula.calculator.** {
    *;
}

# 保留枚举
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# 保留序列化相关
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

# 保留注解
-keepattributes *Annotation*
-keepattributes Signature
-keepattributes Exceptions
-keepattributes SourceFile,LineNumberTable
-keepattributes InnerClasses,EnclosingMethod
-keepattributes StackMapTable

# 混淆配置
-target 1.8
-optimizationpasses 5
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses
-verbose

# 混淆算法
-optimizations !code/simplification/arithmetic,!code/simplification/cast,!field/*,!class/merging/*

# 不混淆第三方库
-dontwarn com.alibaba.fastjson.**
-dontwarn net.objecthunter.exp4j.**

# 不混淆fastjson相关
-keep class com.alibaba.fastjson.** { *; }

# 不混淆exp4j相关
-keep class net.objecthunter.exp4j.** { *; }

# 混淆后的类名映射文件（可选，用于调试）
-printmapping mapping.txt
-printseeds seeds.txt
-printusage usage.txt

