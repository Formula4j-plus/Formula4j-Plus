name: Publish to GitHub Packages

on:
  release:
    types: [created]
  # 也可以手动触发
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '跳过测试'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史
        # 如果连接失败，可以手动重试 workflow
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          # 只缓存仓库，不缓存 settings.xml
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-repo-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-repo-
      
      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "Maven settings.xml 已创建"
          # 验证配置（不显示敏感信息）
          if [ -f ~/.m2/settings.xml ]; then
            echo "✓ settings.xml 文件存在"
          fi
      
      - name: Build with Maven
        run: |
          SKIP_TESTS="${{ github.event.inputs.skip_tests }}"
          if [ "$SKIP_TESTS" = "true" ]; then
            echo "跳过测试，构建项目..."
            mvn clean package -DskipTests
          else
            echo "运行测试并构建项目..."
            mvn clean package
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        timeout-minutes: 30  # 增加超时时间
      
      - name: Generate Javadoc
        run: mvn javadoc:javadoc
        continue-on-error: true  # Javadoc 失败不影响发布
        
      - name: Verify Maven settings
        run: |
          echo "验证 Maven settings.xml 配置..."
          if [ -f ~/.m2/settings.xml ]; then
            echo "✓ settings.xml 存在"
            # 检查是否包含 github server 配置（不显示敏感信息）
            if grep -q '<id>github</id>' ~/.m2/settings.xml; then
              echo "✓ GitHub server 配置已找到"
            else
              echo "✗ 未找到 GitHub server 配置"
              exit 1
            fi
          else
            echo "✗ settings.xml 不存在"
            exit 1
          fi
      
      - name: Publish to GitHub Packages
        run: |
          # 添加重试逻辑
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "尝试发布 (第 $attempt 次/共 $max_attempts 次)..."
            if mvn deploy -DskipTests; then
              echo "✓ 发布成功！"
              exit 0
            else
              echo "✗ 发布失败，等待 10 秒后重试..."
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                sleep 10
              fi
            fi
          done
          echo "✗ 发布失败，已重试 $max_attempts 次"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        timeout-minutes: 20  # 增加超时时间
      
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: maven-artifacts
          path: |
            target/*.jar
            target/*.pom
          retention-days: 30
      
      - name: Upload Javadoc
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: javadoc
          path: target/site/apidocs/**
          retention-days: 30
          if-no-files-found: ignore

